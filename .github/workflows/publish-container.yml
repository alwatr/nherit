# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build & Publish Containers

on:
  workflow_dispatch:

  push:
    branches:
      - next

  pull_request:

  release:
    types:
      - created

env:
  USER: alwatr

jobs:
  test:
    if: github.repository_owner == 'Alwatr'

    name: Test Containers
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7

      - name: ❔ Check Container files changed
        id: file_change
        if: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            base: base/**
            core: core/**
            ws: ws/**
            cdn: cdn/**
            pwa: pwa/**

      # Build in dependency order on one runner. Each image is also tagged as the exact base image
      # that its children use in FROM, so they are tested on this commit, not on the last release.
      # An image is tested when its folder changed or its base image was built here (release: all).
      - name: 🧪 Build and test changed containers
        env:
          CHANGED: ${{ join(fromJSON(steps.file_change.outputs.changes || '["base"]'), ' ') }}
        run: |
          echo "Changed: $CHANGED"
          built=""
          for path in base core ws cdn pwa; do
            from=$(sed -n "s#^FROM \(ghcr.io/$USER/nherit:[^ ]*\).*#\1#p" "$path/Dockerfile")
            case "$from" in
            *-base) parent="base" ;;
            "") parent="none" ;;
            *) parent="core" ;;
            esac
            case " $CHANGED $built " in
            *" $path "* | *" $parent "*) ;;
            *) echo "Skip $path"; continue ;;
            esac
            echo "::group::Build and test $path"
            docker build -t "$USER/nherit:$path-test" "./$path"
            docker run --rm -e TEST_MODE=1 "$USER/nherit:$path-test" /etc/nginx/entrypoint.sh nginx -T -c /etc/nginx/nginx.conf
            suffix=""; [ "$path" != "core" ] && suffix="-$path"
            for child in */Dockerfile; do
              child_from=$(sed -En "s#^FROM (ghcr.io/$USER/nherit:[0-9.]*$suffix)([[:space:]].*)?\$#\1#p" "$child")
              if [ -n "$child_from" ]; then docker tag "$USER/nherit:$path-test" "$child_from"; fi
            done
            built="$built $path"
            echo "::endgroup::"
          done

  build:
    needs: test
    if: github.repository_owner == 'Alwatr'

    name: Build & Publish Containers
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - path: base
            suffix: -base
          - path: core
            suffix: ''
          - path: ws
            suffix: -ws
          - path: cdn
            suffix: -cdn
          - path: pwa
            suffix: -pwa

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@v7

      - name: ❔ Check Container files changed
        id: file_change
        if: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container_folder:
              ./${{ matrix.path }}/**

      - name: 🏗 Install cosign
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: 🏗 Setup Docker Buildx
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/setup-buildx-action@v4

      - name: 🏗 Cache Docker Layers
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: container/${{ matrix.path }}

      - name: 🏗 Log into docker hub registry
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/login-action@v4
        with:
          username: ${{env.USER}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}

      - name: 🏗 Log into ghcr.io registry
        if: ${{ github.event_name != 'pull_request' && steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{env.USER}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 🏗 Extract metadata
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          images: |
            name=ghcr.io/${{env.USER}}/nherit,enable=true
            name=docker.io/${{env.USER}}/nherit,enable=true
          flavor: |
            latest=${{ matrix.path == 'core' }}
          tags: |
            type=semver,enable=true,pattern={{major}}${{matrix.suffix}}
            type=semver,enable=true,pattern={{major}}.{{minor}}${{matrix.suffix}}
            type=semver,enable=true,pattern={{version}}${{matrix.suffix}}
            type=ref,enable=true,event=branch,suffix=${{matrix.suffix}}

      - name: 🚀 Build and publish container image
        if: ${{ steps.file_change.outputs.container_folder != 'false' }}
        uses: docker/build-push-action@v7
        env:
          NGINX_ERROR_LOG_LEVEL: debug
          NGINX_ENABLE_ACCESS_LOG: 'on'
          NGINX_PROCESSES_AUTOTUNE: 'on'
          NGINX_RESOLVERS: 'local'
          NGINX_DISALLOW_ROBOTS: 'on'
          NGINX_LOWERCASE_URI: 'on'

        with:
          context: ./${{matrix.path}}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            BUILD_DATE=${{github.event.repository.updated_at}}
            BUILD_REV=${{github.sha}}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
